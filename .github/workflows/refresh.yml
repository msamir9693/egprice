name: Tests

# Prices are refreshed from your own PC (run_local.ps1), not from GitHub:
# Amazon/Noon/Jumia block GitHub's servers. This workflow only runs the offline tests.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
